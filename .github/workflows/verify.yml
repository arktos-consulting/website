name: Verify

# Verifies the site on every pull request and on every pushed branch.
#
# This workflow is separate from the deployment one: a verification must run on
# a PR before merge, not only after a push to main. The deployment re-runs its
# own checks on its side, so that a commit arriving directly on main can never
# be published without being verified.

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify types
        run: bun run typecheck

      - name: Verify Astro components
        run: bunx astro check

      - name: Build site
        run: bun run build
